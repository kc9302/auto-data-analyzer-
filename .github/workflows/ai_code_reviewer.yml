name: "AI Code Review & Quality Gate"

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ai-code-review:
    name: "AI Quality Gate (Grade A Gatekeeper)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Run AI Code Reviewer & Grade A Enforcement
        id: review
        run: |
          uv run python .github/scripts/ai_reviewer.py --base-ref origin/${{ github.base_ref }} --out-report review_report.md

      - name: Post Review Report as Pull Request Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('review_report.md')) {
              const body = fs.readFileSync('review_report.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
