# ==============================================================================
# 데이터베이스 접속 설정 예제 (Auto Data Analyzer & ML Scout)
# 사용 방법: 이 파일을 복사하여 configs/db_config.yaml을 만들고 실제 접속 정보를 입력하세요.
# 실행: python -m src.main --config configs/db_config.yaml
# ==============================================================================

# [선택 1: PostgreSQL]
database:
  engine: postgresql              # postgresql, mysql, oracle, mssql, sqlite, parquet
  host: 192.168.1.100             # DB 서버 IP 또는 도메인
  port: 5432                      # 포트 번호 (기본: 5432)
  database: enterprise_dw         # 데이터베이스 이름
  username: readonly_user         # 읽기 전용 접속 계정
  password: ${DB_PASSWORD:-secret123} # 비밀번호 (환경변수 치환 지원: ${VAR:-default})
  schema: public                  # 스키마 (선택 사항)
  table: customer_churn           # 기본 분석 대상 테이블명
  target: churn                   # 머신러닝 예측 타깃 컬럼명

