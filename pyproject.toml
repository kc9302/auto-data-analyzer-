[project]
name = "auto-data-analyzer"
version = "1.0.0"
description = "Auto Data Analyzer & ML Scout - Safe DB profiling, 100% real-data presentation decks & AutoML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy>=2.0.0",
    "python-pptx>=0.6.21",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "lightgbm>=4.0.0",
    "pytest>=7.4.0",
    "streamlit>=1.63.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
auto-data-analyzer = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false

